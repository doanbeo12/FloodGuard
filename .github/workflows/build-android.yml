name: Build FloodGuard Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      FLOODGUARD_API_URL: "https://backend-production-189c.up.railway.app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: flutter create --platforms=android --org com.floodguard --project-name flood_warning_app .

      - name: Ensure app label
        run: sed -i 's/android:label="[^"]*"/android:label="FloodGuard"/' android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$FLOODGUARD_API_URL

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodGuard-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
