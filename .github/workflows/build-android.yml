name: Build FloodGuard Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public FloodGuard API URL"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: flutter create --platforms=android --org com.floodguard --project-name flood_warning_app .

      - name: Ensure app label
        run: sed -i 's/android:label="[^"]*"/android:label="FloodGuard"/' android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodGuard-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
