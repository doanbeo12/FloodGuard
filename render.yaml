services:
  - type: web
    name: floodguard-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: node db-init-v2.js && node server.js
    healthCheckPath: /api/v2/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MYSQL_URL
        sync: false
      - key: V2_DB_NAME
        value: floodguard_v2
      - key: MQTT_ENABLED
        value: "false"
      - key: MQTT_V2_ENABLED
        value: "true"
      - key: MQTT_V2_URL
        value: mqtt://broker.hivemq.com:1883
      - key: MQTT_V2_TOPIC_NODE1
        value: floodguard/v2/node1/realtime
      - key: MQTT_V2_TOPIC_NODE2
        value: floodguard/v2/node2/realtime
      - key: MQTT_V2_TOPIC_STATUS
        value: floodguard/v2/central/status
      - key: MQTT_V2_TOPIC_COMMAND
        value: floodguard/v2/central/command
      - key: DB_V2_SAMPLE_INTERVAL_MS
        value: "5000"
      - key: MQTT_V2_FRESHNESS_MS
        value: "30000"
      - key: RAIN_MM_PER_TIP
        value: "0"
      - key: TIDE_AUTO_FETCH
        value: "false"
      - key: FORECAST_SIM_TIME_SCALE
        value: "60"
      - key: TIDE_SIM_TIME_SCALE
        value: "60"
      - key: FLOOD_V2_WATCH_CM
        value: "4"
      - key: FLOOD_V2_WARNING_CM
        value: "8"
      - key: FLOOD_V2_DANGER_CM
        value: "12"

  - type: web
    name: floodguard-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: >-
      printf 'window.FLOODGUARD_API_BASE_URL="https://%s";\n' "$API_HOST" > public/config.js
    staticPublishPath: ./public
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: floodguard-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
