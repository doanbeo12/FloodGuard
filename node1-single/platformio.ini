[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit AHTX0@^2.0.0
    adafruit/Adafruit BMP085 Library@^1.2.0
    adafruit/Adafruit Unified Sensor@^1.1.0
build_flags =
    -D CORE_DEBUG_LEVEL=1
